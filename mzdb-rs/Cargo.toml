[package]
name = "mzdb-rs"
version = "0.3.0"
edition = "2024"
description = "A Rust library for reading mzDB mass spectrometry files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mzdb/mzdb-rs"
keywords = ["mass-spectrometry", "mzdb", "proteomics", "bioinformatics"]
categories = ["science", "database"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[dependencies]
anyhow = "1.0"
anyhow_ext = "0.2"
bytes = "1.5"
fallible-iterator = "0.3"
itertools = "0.13"
rusqlite = { version = "0.32", features = ["blob", "bundled"] }
log = "0.4"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_rusqlite = "0.36"
serde_with = "3.11"
strum_macros = "0.26"

# Optional dependencies for the CLI feature (bins)
clap = { version = "4.4", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional= true }

# Optional dependencies for diafication module
ordered-float = { version = "4.2", optional= true } # should be generalizedto all modules?
rmpv = { version = "1.0", optional= true }

# Optional dependencies for thermo writer
thernio = { path = "../../rusteomics/thernio", optional = true, features = ["raw"] }
xmltree = { version = "0.12", optional = true }

# Optional dependencies for processing module
nalgebra = { version = "0.32", optional = true }
statrs = { version = "0.16", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
thiserror = { version = "1.0", optional = true }
rmp-serde = { version = "1.3", optional = true }

[features]
default = []
writer = []
cli = ["clap", "env_logger"]
dda2dia = ["cli", "writer", "ordered-float", "rmpv"]
thermo2mzdb = ["writer", "thernio", "xmltree"]
shrinkdia = ["cli", "processing", "ordered-float", "rmpv"]
processing = ["nalgebra", "statrs", "thiserror", "rmp-serde"]
processing-parallel = ["processing", "crossbeam-channel"]
all = ["processing-parallel", "thermo2mzdb"]

[[bench]]
name = "mzdb_bench"
harness = false

[[bin]]
name = "mzdb_sandbox"
path = "src/main.rs"

[[bin]]
name = "mzdb2mgf"
path = "src/bin/mzdb2mgf.rs"

[[bin]]
name = "mzdb2peakeldb"
path = "src/bin/mzdb2peakeldb.rs"
required-features = ["cli","processing"]

[[bin]]
name = "dda2dia"
path = "src/bin/dda2dia.rs"
required-features = ["cli","dda2dia"]

[[bin]]
name = "mzdbcheck"
path = "src/bin/mzdbcheck.rs"
required-features = ["cli"]

[[bin]]
name = "shrinkdia"
path = "src/bin/shrinkdia.rs"
required-features = ["cli", "shrinkdia"]

[lib]
name = "mzdb"
path = "src/lib.rs"
crate-type = ["lib"]
required-features = ["all"]
