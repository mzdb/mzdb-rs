[package]
name = "mzdb-rs"
version = "0.3.0"
edition = "2024"
description = "A Rust library for reading mzDB mass spectrometry files"
authors = ["David Bouyssie", "Caroline Sancho"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mzdb/mzdb-rs"
keywords = ["mass-spectrometry", "mzdb", "proteomics", "bioinformatics"]
categories = ["science", "database"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[dependencies]

# Core dependencies
anyhow = "1.0"
anyhow_ext = "0.2"
fallible-iterator = "0.3"
log = "0.4"
ordered-float = "4.2"
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["blob", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_rusqlite = "0.36"
smallvec = { version = "1.15", features = ["serde"] }
strum_macros = "0.26"

# Optional dependencies for the CLI feature (bins)
clap = { version = "4.4", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }

# Optional dependencies for thermo writer
thernio = { path = "../../rusteomics/thernio", optional = true, features = ["raw"] }
xmltree = { version = "0.12", optional = true, features = ["attribute-sorted"] }

# Optional dependencies for processing module
nalgebra = { version = "0.33", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
rmp-serde = { version = "1.3", optional = true }
itertools = { version = "0.13", optional = true }

[features]
default = []
writer = ["xmltree"]
cli = ["clap", "env_logger"]
thermo2mzdb = ["thernio", "writer"]
processing = ["itertools", "nalgebra", "rmp-serde"]
processing-parallel = ["processing", "crossbeam-channel"]
dda2dia = ["processing", "writer"]
shrinkdia = ["processing", "writer"]
all = ["dda2dia", "processing-parallel", "shrinkdia", "thermo2mzdb"]

[[bench]]
name = "mzdb_bench"
harness = false

[[bin]]
name = "mzdb_sandbox"
path = "src/main.rs"

[[bin]]
name = "mzdb2mgf"
path = "src/bin/mzdb2mgf.rs"
required-features = ["cli"]

[[bin]]
name = "mzdb2peakeldb"
path = "src/bin/mzdb2peakeldb.rs"
required-features = ["cli","processing-parallel"]

[[bin]]
name = "dda2dia"
path = "src/bin/dda2dia.rs"
required-features = ["cli","dda2dia"]

[[bin]]
name = "mzdbcheck"
path = "src/bin/mzdbcheck.rs"
required-features = ["cli"]

[[bin]]
name = "thermo2mzdb"
path = "src/bin/thermo2mzdb.rs"
required-features = ["cli", "thermo2mzdb"]

[[bin]]
name = "shrinkdia"
path = "src/bin/shrinkdia.rs"
required-features = ["cli", "shrinkdia"]

[[bin]]
name = "slicemzdb"
path = "src/bin/slicemzdb.rs"
required-features = ["cli"]

[lib]
name = "mzdb"
path = "src/lib.rs"
crate-type = ["lib"]
required-features = ["all"]
